[project]
name = "pii-aware-llm-router"
version = "0.1.0"
description = "Routes document Q&A between a local model and the Mistral API under a data-sensitivity constraint, with measured cost, latency and anonymizer accuracy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.37.0",
    "presidio-analyzer>=2.2.364",
    "requests>=2.34.2",
    "spacy>=3.8.16",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
[tool.pyright]
venvPath="."
venv=".venv"
[tool.pytest.ini_options]
pythonpath=["."]
